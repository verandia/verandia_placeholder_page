    <style>
      @font-face {

        font-style: normal;

      }

      @font-face {

        font-display: swap;
        font-weight: 200 800;
        src: url('./fonts/newsreader-latin-ext-opsz-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Newsreader Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('./fonts/newsreader-latin-opsz-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --paper: #fbf8f3;
        --cream: #f4eee5;
        --ink: #1d1e1b;
        --ink-soft: #45463f;
        --muted: #77736a;
        --line: rgb(29 30 27 / 0.12);
        --bronze: #a97c5d;
        --bronze-deep: #8a6147;
        --bronze-light: #d2b296;
        --font-display: 'Newsreader Variable', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        --font-sans: 'Manrope Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 4vw, 3rem);
        background:
          radial-gradient(ellipse 80% 60% at 50% 42%, var(--paper) 0%, var(--cream) 100%);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: var(--bronze-light);
        color: var(--ink);
      }

      :focus-visible {
        outline: 2px solid var(--bronze);
        outline-offset: 4px;
        border-radius: 2px;
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      main {
        width: 100%;
        max-width: 34rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: clamp(2.25rem, 5vw, 3.25rem);
      }

      .logo-wrap {
        width: min(100%, 24rem);
        margin: 0;
      }

      .logo-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }

      .divider {
        width: 3.5rem;
        height: 1px;
        background: var(--bronze);
        opacity: 0.45;
      }

      .contact {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
        font-style: normal;
      }

      .contact-link {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--ink);
        text-decoration: none;
        transition: color 0.35s var(--ease-out);
      }

      .contact-link:hover {
        color: var(--bronze-deep);
      }

      .contact-link .icon {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--bronze);
        flex-shrink: 0;
        transition: transform 0.35s var(--ease-out);
      }

      .contact-link:hover .icon {
        transform: translateY(-1px);
      }

      .contact-phone {
        font-family: var(--font-display);
        font-size: clamp(1.6rem, 1.35rem + 1vw, 2.15rem);
        font-weight: 380;
        letter-spacing: -0.01em;
        line-height: 1.15;
      }

      .contact-email {
        font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Verandia – Zabudowa Tarasów. Gdzie Dom Spotyka Się z Ogrodem</h1>

      <figure class="logo-wrap">
        <img
          src="./logo.svg"
          alt="Verandia – Zabudowa Tarasów. Gdzie Dom Spotyka Się z Ogrodem"
          width="716"
          height="524"
        />
      </figure>

      <div class="divider" aria-hidden="true"></div>

      <address class="contact" aria-label="Dane kontaktowe">
        <a class="contact-link contact-phone" href="tel:+48607182309" aria-label="Zadzwoń: 607 182 309">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M6.6 3.5h2.6l1.4 4-2 1.3a12 12 0 0 0 6.6 6.6l1.3-2 4 1.4v2.6a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z"
            />
          </svg>
          <span>607 182 309</span>
        </a>

        <a
          class="contact-link contact-email"
          href="mailto:kontakt@verandia.com.pl"
          aria-label="Napisz e-mail: kontakt@verandia.com.pl"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="5.5" width="18" height="13" rx="1.5" />
            <path d="m3.5 6.5 8.5 6.5 8.5-6.5" />
          </svg>
          <span>kontakt@verandia.com.pl</span>
        </a>
      </address>
    </main>
  </body>
</html>
